name: Mobile gate

on:
  pull_request:
    branches: [main]
    # Docs-only changes don't affect the mobile app or shared packages, so skip the
    # gate entirely for them (no install / typecheck / test). Markdown formatting is
    # still enforced locally by the husky pre-commit hook (lint-staged → oxfmt).
    # paths-ignore only skips when *every* changed file matches, so a PR touching both
    # docs and code still runs the full gate.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # workflow_call has no path filter on purpose: the release pipeline calls this gate
  # and must always run the full checks regardless of what changed.
  workflow_call: {}

# A new push to the same ref supersedes any in-flight run — don't burn minutes
# finishing a gate for a commit that's already been replaced.
concurrency:
  group: mobile-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore turbo's local cache (.turbo/cache) so unchanged packages'
      # typecheck/test tasks are cache hits. Keyed on sha so every run saves a
      # fresh entry; restore-keys falls back to the newest previous one.
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Format check
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck + unit tests
        run: pnpm exec turbo run typecheck test

      # Maestro e2e is intentionally NOT run here: it needs a built binary on a booted
      # simulator/emulator, which is slow, flaky, and costs a build per run — a poor fit
      # for a per-PR gate. Instead it runs locally as a hard gate in the release command
      # (`pnpm release` → scripts/release/pre-release-check.mjs) right before a tag goes out.
      # See RELEASING.md. Revisit CI e2e (Maestro Cloud / EAS Workflows) if cadence grows.

  # Separate job so the audit's ~3min of registry calls never sits on the
  # gate's critical path (#237). Report-only (continue-on-error) until the
  # pre-existing backlog — 24 high, all transitive as of 2026-09-01 — is
  # burned down (#235); then drop it to make this a hard gate. Complements
  # pnpm's minimumReleaseAge quarantine (pnpm-workspace.yaml), which can't
  # catch already-aged bad versions. CI only: network call, not pre-commit.
  audit:
    name: Dependency audit (high+, report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --prod --audit-level=high
