name: Dependency audit

# Weekly instead of per-PR: the audit spends ~3 min on registry calls and
# reports the same transitive advisories on every PR (#237). A failing run
# emails the workflow's last committer. Becomes meaningful once the
# pre-existing backlog (#235) is burned down; until then expect red.
on:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC, before Dependabot's 06:00 Budapest run
  workflow_dispatch: {}

jobs:
  audit:
    name: Dependency audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --prod --audit-level=high
