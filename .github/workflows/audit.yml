name: Dependency audit

# Weekly instead of per-PR: the audit spends ~3 min on registry calls and
# reports the same transitive advisories on every PR (#237). A failing run
# emails the workflow's last committer. Becomes meaningful once the
# pre-existing backlog (#235) is burned down; until then expect red.
on:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC, before Dependabot's 06:00 Budapest run
  workflow_dispatch: {}

jobs:
  audit:
    name: Dependency audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --prod --audit-level=high
