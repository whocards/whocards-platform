# Site Base directory MUST be apps/app: from the repo root `pnpm build` builds every app and fails on their env.
[build.environment]
NODE_VERSION = "24"

[build]
command = "pnpm build"
publish = "dist"
# Skip deploys (production and previews) when nothing app builds from changed.
ignore = "sh ../../scripts/ci/netlify-ignore.sh app"
