# Verifies RTL/LTR question alignment on device (ticket: Hebrew not right-aligned).
# Alignment is a pure function of writing direction, so en (LTR) + he (RTL) exercise
# both branches; every other shipped language is LTR and behaves like en.
#
# Issue #176 moved the language sheet out of the play screen entirely — it's only
# reachable from the home screen's Settings menu now, so this flow exits back to
# the home screen to switch languages instead of opening a bar button mid-play.
#
# NOTE (issue #189, fourth pass): Settings is a single Modal with sliding
# internal pages. Picking a primary language now auto-returns to the menu —
# same as Game/Theme — so no explicit "back" tap is needed after the pick
# (settings-modal.tsx's Language onSelect calls goBack() itself); the menu's
# own header is "close", not "back". (#216: this flow used to tap "back"
# here for an older, third-pass behavior where the pick stayed put — that
# tap started failing once the fourth pass added the auto-return, since by
# the time it ran the sheet was already back on the menu page.)
#
# Run: pnpm --filter mobile e2e:ios  (or e2e:android)   (needs a Release build on a booted device)
appId: ${APP_ID}
---
- launchApp:
    clearState: true # reset persisted language so we always start from the default

# Landing → player
- assertVisible: 'Play'
- tapOn:
    text: 'Play'
    retryTapIfNoChange: true
- assertNotVisible: 'Play'

# Reveal chrome and capture the default (English, LTR — should read left-aligned)
- tapOn:
    point: '50%,45%'
- takeScreenshot: .maestro/artifacts/en-ltr

# Exit back to the home screen, switch to Hebrew via the Settings menu (the
# play screen has no settings entry of its own anymore), then reopen Play.
- tapOn: 'exit deck'
- tapOn: 'Settings'
- assertVisible: 'Language: English'
- tapOn: 'Language: English'
- tapOn: 'Hebrew'
- waitForAnimationToEnd # the pick auto-returns to the menu (settings-modal.tsx goBack())
- tapOn: 'close'
- tapOn: 'Play'

# Back on the card in Hebrew — should now read RIGHT-aligned
- tapOn:
    point: '50%,45%'
- takeScreenshot: .maestro/artifacts/he-rtl
