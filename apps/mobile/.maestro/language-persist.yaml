# A chosen language survives an app relaunch (language-store persistence, ticket 0009).
# Uses `?q=1` so the same question renders before and after, making the language
# switch observable: the English text is present at first, gone once Hebrew is
# selected, and still gone after a cold relaunch — proving the choice persisted.
#
# Issue #176 moved language selection out of the play screen and into the home
# screen's Settings menu, so the switch happens BEFORE the deep link is opened,
# not from within the player.
#
# NOTE (issue #189, fourth pass): Settings is a single Modal with sliding
# internal pages. Picking a primary language now auto-returns to the menu —
# same as Game/Theme — so no explicit "back" tap is needed after the pick
# (settings-modal.tsx's Language onSelect calls goBack() itself); the menu's
# own header is "close", not "back". (#216: this flow used to tap "back"
# here for an older, third-pass behavior where the pick stayed put — that
# tap started failing once the fourth pass added the auto-return, since by
# the time it ran the sheet was already back on the menu page.)
#
# Run: pnpm --filter mobile e2e:ios  (or e2e:android)   (needs the app installed on a booted device)
appId: ${APP_ID}
tags:
  - ios
  - android
---
- launchApp:
    clearState: true # start clean: default language is English

# Switch to Hebrew via the Settings menu.
- tapOn: 'Settings'
- assertVisible: 'Language: English'
- tapOn: 'Language: English'
- tapOn: 'Hebrew'
- waitForAnimationToEnd # the pick auto-returns to the menu (settings-modal.tsx goBack())
- tapOn: 'close'

# The same card (q=1) now renders Hebrew, so the English text is absent from the start.
- stopApp # deep-link cold to avoid the iOS "Open in WhoCards?" foreground confirm
- openLink: mobile://play/library?q=1
- tapOn:
    text: 'Open'
    optional: true
- assertNotVisible: '(?s).*most interesting thing you have learned recently.*'

# Relaunch (stop the app, then cold deep-link to the same card) WITHOUT clearing
# state. The stored language is reapplied, so the English text is still absent —
# proving the choice persisted across the restart.
- stopApp
- openLink: mobile://play/library?q=1
- tapOn:
    text: 'Open'
    optional: true
# Cold launch holds the first card paint behind the AsyncStorage language read, so
# wait for the English text to be gone rather than asserting on a fixed animation beat.
- extendedWaitUntil:
    notVisible: '(?s).*most interesting thing you have learned recently.*'
    timeout: 5000
