# Happy-path player loop: launch → switch language via the home Settings menu →
# play → swipe both ways → share. Exercises the core in-app surface (landing CTA,
# the Settings menu's Language sheet, the swipe gesture engine, the auto-hiding
# chrome, and the share action) on one run.
#
# Issue #176 moved the language sheet out of the play screen entirely — it's
# only reachable from the home screen's Settings menu now, so the language
# switch happens BEFORE tapping Play, not from within the player.
#
# NOTE (issue #176): rewritten for the new Settings menu — not yet re-run on
# device in the PR that made this change; run before relying on it.
#
# Run: pnpm --filter mobile e2e:ios  (or e2e:android)   (needs the app installed on a booted device)
appId: ${APP_ID}
tags:
  - ios
  - android
---
- launchApp:
    clearState: true # reset persisted language so we always start from the default

# Landing: switch language via Settings before playing.
- assertVisible: 'Play'
- tapOn: 'Settings'
- assertVisible: 'Language: English'
- tapOn: 'Language: English'
- assertVisible: 'Choose your language'
- tapOn: 'Hebrew'
- waitForAnimationToEnd # let the nested sheet finish dismissing before continuing
- tapOn: 'close'

# Landing → player
- tapOn: 'Play'

# Swipe forward to the next card, then back — the gesture engine commits a nav each way.
- swipe:
    direction: LEFT
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
- waitForAnimationToEnd

# Reveal the auto-hiding chrome (a tap anywhere) and fire the share action. The
# native share sheet is OS chrome (varies by platform/version), so we don't
# assert its contents — a clean tap with no error is the signal the action is
# wired.
- tapOn:
    point: '50%,45%'
- tapOn: 'share question'
- takeScreenshot: .maestro/artifacts/play-language-share
