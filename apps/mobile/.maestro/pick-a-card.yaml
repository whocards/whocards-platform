# The Pick a Card Game: choose it from the home Settings menu (issue #176 moved
# Game off the old Library chip into the Settings sheet), then verify the deal
# loop — Pick reveals a card, Next returns to the pick screen, Back re-reads
# the last card. Questions are shuffled, so the flow asserts on the pick button's
# presence/absence rather than specific question text. Buttons are matched by
# their accessibility labels (a button's children are collapsed behind its label
# in the iOS accessibility tree).
#
# NOTE (issue #189, third pass): Settings is now a single Modal with sliding
# internal pages, not a stack of separate Modals — picking a Game still slides
# straight back to the menu on its own (same as before), so this flow's steps
# are unchanged. Not yet re-run on device in the PR that made this change; run
# before relying on it.
#
# Run: pnpm --filter mobile e2e:ios  (or e2e:android)   (needs the app installed on a booted device)
appId: ${APP_ID}
tags:
  - ios
  - android
---
- launchApp:
    clearState: true # start clean: default Game is Classic
- tapOn: 'Settings'
- assertVisible: 'Game: Classic'
- tapOn: 'Game: Classic'
- assertVisible: 'Choose your game'
- tapOn: 'Pick a Card'
- assertVisible: 'Game: Pick a Card'
- tapOn: 'close'
- tapOn: 'Play'

# The pick screen: the deal button is the only card-area content.
- assertVisible: 'Pick a card'
- assertVisible: 'Tap to pick a card'
- tapOn: 'Pick a card'
- waitForAnimationToEnd
- assertNotVisible: 'Pick a card' # a card is revealed
- assertVisible: 'Tap for next card'

# Tapping the revealed card puts it down and returns to the pick screen
# (never straight to another card).
- tapOn:
    point: '50%,45%' # mid-card
- assertVisible: 'Pick a card'

# Back re-reads the last dealt card.
- tapOn:
    # reveal the chrome by tapping ABOVE the deck, not on a card. The deck is
    # vertically centered between insets.top and the bottom bar (no more top
    # chip band since #186), so on a short low-inset screen (SE-class: 667pt,
    # ~20pt inset) its top edge sits around 9-10% — 6% keeps ~23pt of headroom
    # there while staying well below the status bar on notched devices.
    point: '50%,6%'
- tapOn: 'previous question'
- waitForAnimationToEnd
- assertNotVisible: 'Pick a card'
