# Visual on-device check for the Pixel-notch fix (#102): the language sheet header
# ("Choose your language" + close button) must sit BELOW the status bar / display
# cutout, not under the clock and system icons. Maestro has no coordinate assertion,
# so this captures a screenshot for review on a device WITH a cutout (e.g. a Pixel) —
# the title overlapping the status bar is the regression. The deterministic guard for
# the inset math is the jest test (src/__tests__/language-modal.test.tsx).
#
# Issue #176 moved the language sheet out of the play screen and into the home
# screen's Settings menu — it's now a NESTED sheet (Settings → Language), but the
# inset math is per-sheet (each `<Modal>` gets its own safe-area context), so
# nesting shouldn't change the regression this flow is guarding against.
#
# NOTE (issue #176): rewritten for the new Settings menu — not yet re-run on
# device in the PR that made this change; run before relying on it.
#
# Run: pnpm --filter mobile e2e:ios  (or e2e:android)   (needs the app installed on a booted device)
appId: ${APP_ID}
tags:
  - ios
  - android
---
- launchApp:
    clearState: true
- tapOn: 'Settings'
- assertVisible: 'Language: English'
- tapOn: 'Language: English'
- assertVisible: 'Choose your language'
- takeScreenshot: .maestro/artifacts/language-modal-inset
